<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kherentt - Will You Be My Girlfriend? 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS SAMA PERSIS - TIDAK BERUBAH */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        .ocean {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 200px;
            background: linear-gradient(to top, #4facfe 0%, transparent 70%);
            z-index: 1; animation: wave 10s ease-in-out infinite alternate;
        }
        @keyframes wave {
            0% { transform: translateX(0) translateY(0px); }
            50% { transform: translateX(-25px) translateY(15px); }
            100% { transform: translateX(0) translateY(0px); }
        }
        .heart {
            position: absolute; color: #ff69b4; font-size: 20px;
            animation: float 6s ease-in-out infinite; z-index: 10;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.8; }
        }
        .bloom-flower {
            position: absolute; font-size: 60px; color: #ff69b4;
            animation: bloom 2s ease-out forwards; z-index: 20;
        }
        @keyframes bloom {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }
        .container {
            min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
            position: relative; z-index: 5;
        }
        .moana-decoration {
            position: absolute; font-size: 80px; color: rgba(255, 182, 193, 0.3);
            animation: sway 4s ease-in-out infinite alternate;
        }
        .moana-left { top: 20%; left: 10%; }
        .moana-right { top: 20%; right: 10%; transform: scaleX(-1); }
        @keyframes sway {
            0% { transform: translateX(0) rotate(-5deg); }
            100% { transform: translateX(10px) rotate(5deg); }
        }
        h1 {
            font-family: 'Dancing Script', cursive; font-size: clamp(2.5rem, 8vw, 5rem);
            color: #ff1493; text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
            margin-bottom: 30px; text-align: center; animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .question {
            font-size: clamp(1.2rem, 4vw, 2rem); color: #c71585;
            margin-bottom: 50px; text-align: center; font-weight: 600;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }
        .buttons { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
        .btn {
            padding: 20px 40px; font-size: 1.5rem; font-weight: 600; border: none;
            border-radius: 50px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.4); position: relative;
            overflow: hidden; text-transform: uppercase; letter-spacing: 2px;
        }
        .btn-yes { background: linear-gradient(45deg, #ff69b4, #ff1493); color: white; }
        .btn-no {
            background: linear-gradient(45deg, #dda0dd, #da70d6); color: #fff;
            animation: shake 0.5s ease-in-out infinite;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .btn:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 40px rgba(255, 20, 147, 0.6);
        }
        .thankyou-page { text-align: center; animation: fadeInUp 1s ease-out; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .thankyou-title {
            font-family: 'Dancing Script', cursive; font-size: clamp(3rem, 10vw, 6rem);
            background: linear-gradient(45deg, #ff1493, #ff69b4, #ffc0cb);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 20px; text-shadow: none;
        }
        .thankyou-subtitle {
            font-size: 1.5rem; color: #ff1493; margin-bottom: 15px; font-weight: 600;
        }
        .thankyou-subtitle2 {
            font-size: 1.3rem; color: #ff69b4; margin-bottom: 30px; font-weight: 500;
            font-style: italic;
        }
        .i-love-you {
            font-family: 'Dancing Script', cursive; font-size: clamp(2rem, 6vw, 4rem);
            color: #ff1493; text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
            margin-top: 30px; animation: heartbeat 1.5s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .hearts-explosion {
            font-size: 3rem; color: #ff69b4; animation: explode 2s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }
        .hidden { display: none !important; }
        @media (max-width: 768px) {
            .buttons { flex-direction: column; align-items: center; }
            .btn { width: 250px; margin-bottom: 20px; }
        }
    </style>
</head>
<body>
    <div class="ocean"></div>
    <div class="heart" style="top:10%; left:10%; animation-delay: 0s;">💖</div>
    <div class="heart" style="top:20%; right:15%; animation-delay: 1s;">💕</div>
    <div class="heart" style="top:40%; left:20%; animation-delay: 2s;">💗</div>
    <div class="heart" style="top:60%; right:20%; animation-delay: 3s;">💝</div>
    <div class="heart" style="top:80%; left:30%; animation-delay: 4s;">🌺</div>
    <div class="moana-decoration moana-left">🌺</div>
    <div class="moana-decoration moana-right">🌺</div>

    <div class="container">
        <div id="proposalPage">
            <h1><i class="fas fa-heart"></i> Kherentt...</h1>
            <div class="question">Will You Be My Girlfriend? 💕</div>
            <div class="buttons">
                <button class="btn btn-yes" onclick="acceptProposal()">
                    <i class="fas fa-thumbs-up"></i> Ya!
                </button>
                <button class="btn btn-no" id="noBtn" onclick="handleNo()">
                    <i class="fas fa-thumbs-down"></i> Tidak
                </button>
            </div>
        </div>

        <div id="thankyouPage" class="thankyou-page hidden">
            <div class="hearts-explosion">💖💕💗💝🌺</div>
            <h1 class="thankyou-title" id="finalMessage">Thankyou Sayanggg!</h1>
            <p class="thankyou-subtitle" id="finalSubMessage1">Aku bahagia banget! 🌺</p>
            <p class="thankyou-subtitle2" id="finalSubMessage2"></p>
            <div class="i-love-you">I Love You Kherentt 💕</div>
        </div>
    </div>

    <script>
        let noClickCount = 0;
        const noBtn = document.getElementById('noBtn');

        function acceptProposal() {
            // OPSI 1 - YA
            document.getElementById('proposalPage').classList.add('hidden');
            document.getElementById('thankyouPage').classList.remove('hidden');
            document.getElementById('finalMessage').textContent = 'Thankyou Sayanggg! 💕';
            document.getElementById('finalSubMessage1').innerHTML = '<i class="fas fa-heart-pulse"></i> Aku bahagia banget! 🌺';
            document.getElementById('finalSubMessage2').textContent = '';
            createBloomFlowers();
            createHearts();
        }

        function handleNo() {
            noClickCount++;
            
            if (noClickCount === 1) {
                noBtn.innerHTML = '<i class="fas fa-think-peaks"></i> Pikirin lagi yaa 💕';
                noBtn.style.background = 'linear-gradient(45deg, #ffb6c1, #ff69b4)';
                noBtn.style.animation = 'none';
            } 
            else if (noClickCount === 2) {
                noBtn.innerHTML = '<i class="fas fa-heart"></i> Oke deh aku mauu! 🌺';
                noBtn.style.background = 'linear-gradient(45deg, #ff1493, #ff69b4)';
            }
            else if (noClickCount >= 3) {
                // OPSI 2 - TIDAK x3
                document.getElementById('proposalPage').classList.add('hidden');
                document.getElementById('thankyouPage').classList.remove('hidden');
                document.getElementById('finalMessage').textContent = 'Yeayyy, Love You So Muchh! 🌺';
                document.getElementById('finalSubMessage1').innerHTML = 'Yh gabisa nolak kah kidzz 😘';
                document.getElementById('finalSubMessage2').textContent = '';
                createBloomFlowers(); // BUNGA MEKAR DITAMBAHKAN
                createHearts();
            }
        }

        function createBloomFlowers() {
            const flowers = ['🌺', '🌸', '🌹', '💐', '🌷'];
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const flower = document.createElement('div');
                    flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
                    flower.className = 'bloom-flower';
                    flower.style.left = Math.random() * 80 + 10 + '%';
                    flower.style.top = Math.random() * 60 + 10 + '%';
                    document.body.appendChild(flower);
                    setTimeout(() => flower.remove(), 3000);
                }, i * 200);
            }
        }

        function createHearts() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = ['💖', '💕', '💗', '💝', '🌺'][Math.floor(Math.random() * 5)];
                    heart.className = 'heart';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.top = Math.random() * 100 + '%';
                    heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 5000);
                }, i * 100);
            }
        }

        setInterval(() => {
            const heart = document.createElement('div');
            heart.innerHTML = ['💖', '💕', '💗', '💝', '🌺'][Math.random() * 5 | 0];
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.top = '100%';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }, 1000);
    </script>
</body>
</html>
